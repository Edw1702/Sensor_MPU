[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exemplo"
version = "0.1.0"
description = "Leitura e interpretacao do sensor MPU6050"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.5",]

[project.optional-dependencies]
dev = [ "pytest>=7.0",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]